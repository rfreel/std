name: build-godpack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pack: [bend, core, languages, solvers, science, data, web, media, security, devops]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build pack
        run: |
          set -euxo pipefail
          nix build ".#${{ matrix.pack }}" --out-link result

      - name: Test Bend
        if: matrix.pack == 'bend'
        run: |
          set -euxo pipefail
          ./result/bin/bend version
          cat > hello.bend <<'EOF'
          import Base

          def main() -> IO(Unit):
            IO.print("Hello from Bend")
          EOF
          test "$(./result/bin/bend hello.bend)" = "Hello from Bend"
          ./result/bin/bend hello.bend -o hello
          test "$(./hello)" = "Hello from Bend"

      - name: Bundle closure
        run: |
          set -euxo pipefail
          mkdir -p artifact
          nix-store -qR ./result > artifact/closure-paths.txt
          nix path-info -Sh ./result > artifact/result-size.txt
          nix-store --export $(nix-store -qR ./result) | zstd -T0 -10 > "artifact/${{ matrix.pack }}.nar.zst"
          cp flake.lock artifact/flake.lock
          sha256sum artifact/* > artifact/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godpack-${{ matrix.pack }}-x86_64-linux
          path: artifact/
          if-no-files-found: error
          compression-level: 0
